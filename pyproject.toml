[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fleet_harness"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = ["pandas"]

[tool.setuptools.packages.find]
include = ["fleet_harness*", "price_signals*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = [
    "slow: runs MPC simulations (needs paper data, EnergyPlus, Gurobi); run with -m slow",
]
